
services:
  nginx:
    image: nginx:1.0
    build:
      context: .
      dockerfile: requirements/nginx/Dockerfile

    container_name: nginx

    depends_on:
      - wordpress

    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - ./requirements/nginx/conf/:/etc/nginx/http.d/
      - ./requirements/nginx/tools:/etc/nginx/ssl/
      - wp-volume:/var/www/
    restart: always

  mariadb:
    image: mariadb:1.0
    build:
      context: .
      dockerfile: requirements/mariadb/Dockerfile

    container_name: mariadb

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}

    secrets:
      - db_password
      - db_root_password

    networks:
      - inception

    volumes:
      - db-volume:/var/lib/mysql

    restart: always

  wordpress:
    image: wordpress:1.0
    build:
      context: .
      dockerfile: requirements/wordpress/Dockerfile

    container_name: wordpress

    depends_on:
      - mariadb

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
      WP_URL: ${WP_URL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception

    restart: always

    volumes:
      - wp-volume:/var/www/

volumes:
  wp-volume:
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/wordpress

  db-volume:
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/mariadb

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt
