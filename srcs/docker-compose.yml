version: '3'

services:
  nginx:
    build:
      context: .
      dockerfile: requirements/nginx/Dockerfile

    container_name: nginx

    depends_on:
      - wordpress

    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - ./requirements/nginx/conf/:/etc/nginx/http.d/
      - ./requirements/nginx/tools:/etc/nginx/ssl/
      - wp-volume:/var/www/
    restart: always

  mariadb:
    build:
      context: .
      dockerfile: requirements/mariadb/Dockerfile

    container_name: mariadb

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}

    secrets:
      - db_password
      - db_root_password

    networks:
      - inception

    volumes:
      - db-volume:/var/lib/mysql

    restart: always

  wordpress:
    build:
      context: .
      dockerfile: requirements/wordpress/Dockerfile
      # args:
      #   DB_NAME: ${DB_NAME}
      #   DB_USER: ${DB_USER}

    container_name: wordpress

    depends_on:
      - mariadb

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}

    secrets:
      - db_password

    networks:
      - inception

    restart: always

    volumes:
      - wp-volume:/var/www/

volumes:
  wp-volume:
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/wordpress

  db-volume:
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/mariadb

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt
