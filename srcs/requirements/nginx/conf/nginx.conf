server {
    listen 443 ssl;
    server_name tavdiiev.42.fr www.tavdiiev.42.fr;

    root /var/www/;
    index index.php;

    ssl_certificate     /etc/nginx/ssl/tavdiiev.42.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/tavdiiev.42.fr.key;

    ssl_protocols TLSv1.2 TLSv1.3;

location = /wp-admin/ {
    rewrite ^ /wp-admin/index.php last;
}

location / {
    try_files $uri /index.php?$args;
}

location ~ \.php$ {
    # split a URI into: PHP script ($fastcgi_script_name) and additional path info ($fastcgi_path_info)
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    # send a PHP request to to the FastCGI server
    fastcgi_pass wordpress:9000;
    # include fastcgi_params file with additional configuration directives (REQUEST_METHOD, QUERY_STRING, CONTENT_TYPE etc)
    include fastcgi_params;
    # filesystem path to the .php script we will execute (/var/www/file_name.php)
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # additional path info
    fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
